<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SANG â€” 333 Access Layer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #17202a;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 820px;
        }

        .header {
            margin-bottom: 24px;
        }

        .brand {
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .tagline {
            color: #667085;
            font-size: 15px;
        }

        .access-card {
            background: white;
            border: 1px solid #e4e7ec;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 8px 30px rgba(16, 24, 40, 0.06);
        }

        .access-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .access-subtitle {
            color: #667085;
            margin-bottom: 22px;
        }

        .conversation {
            min-height: 260px;
            max-height: 520px;
            overflow-y: auto;
            padding: 10px 0;
        }

        .message {
            margin-bottom: 16px;
            display: flex;
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 14px;
            line-height: 1.5;
            font-size: 15px;
        }

        .message.sang .bubble {
            background: #f2f4f7;
            color: #17202a;
        }

        .message.user .bubble {
            background: #17202a;
            color: white;
        }

        .route-card {
            margin-top: 18px;
            padding: 16px;
            border-radius: 14px;
            background: #f8fafc;
            border: 1px solid #e4e7ec;
        }

        .route-label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: #667085;
            margin-bottom: 6px;
        }

        .route-name {
            font-size: 18px;
            font-weight: 700;
        }

        .route-info {
            color: #667085;
            margin-top: 5px;
            line-height: 1.5;
        }

        .result {
            margin-top: 18px;
            padding: 20px;
            border: 1px solid #e4e7ec;
            border-radius: 16px;
            background: white;
        }

        .result-title {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: #667085;
            margin-bottom: 16px;
        }

        .problem-title {
            font-size: 21px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .description {
            color: #667085;
            line-height: 1.5;
        }

        .location {
            margin-top: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        .result-section {
            margin-top: 20px;
        }

        .result-section h3 {
            font-size: 14px;
            margin-bottom: 7px;
        }

        .result-section p {
            margin: 0;
            line-height: 1.5;
        }

        .routed {
            margin-top: 22px;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.06em;
        }

        .emergency {
            border: 1px solid #f1b5b5;
            background: #fff6f6;
        }

        .emergency .route-name {
            color: #b42318;
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        #messageInput {
            flex: 1;
            padding: 14px 16px;
            border: 1px solid #d0d5dd;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
        }

        #messageInput:focus {
            border-color: #667085;
        }

        #sendButton {
            border: none;
            border-radius: 12px;
            padding: 0 22px;
            background: #17202a;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        #sendButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            margin-top: 12px;
            font-size: 13px;
            color: #667085;
            min-height: 18px;
        }

        .reset {
            margin-top: 14px;
            background: transparent;
            border: none;
            color: #667085;
            cursor: pointer;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 12px;
            }

            .access-card {
                padding: 18px;
            }

            .bubble {
                max-width: 88%;
            }

            .input-row {
                flex-direction: column;
            }

            #sendButton {
                padding: 14px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="brand">SANG</div>
        <div class="tagline">
            Connective intelligence for people, problems, resources and opportunities.
        </div>
    </div>

    <div class="access-card">

        <div class="access-title">333 Access Layer</div>

        <div class="access-subtitle">
            Hello. I am SANG through 333.
            <br>
            Tell me what you need help with.
        </div>

        <div id="conversation" class="conversation"></div>

        <div class="input-row">
    <input
        id="messageInput"
        type="text"
        placeholder="Tell SANG what you need..."
        autocomplete="off"
    >

    <button id="voiceButton" type="button">
        ðŸŽ™ï¸ Speak
    </button>

    <button id="sendButton">
        Send
    </button>
</div>
        <div id="status" class="status"></div>

        <button id="resetButton" class="reset">
            Start new 333 session
        </button>

    </div>

</div>


<script>

const API_BASE = "http://127.0.0.1:8000";

let activeSessionId = null;
let waitingForFollowUp = false;


const conversation = document.getElementById("conversation");
const messageInput = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const statusElement = document.getElementById("status");
const resetButton = document.getElementById("resetButton");


function addMessage(text, sender = "sang") {

    const wrapper = document.createElement("div");

    wrapper.className = `message ${sender}`;

    const bubble = document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent = text;

    wrapper.appendChild(bubble);

    conversation.appendChild(wrapper);

    conversation.scrollTop = conversation.scrollHeight;

    if (sender === "sang" && voiceResponseMode) {
        speakSang(text);
    }
}

function addRouteCard(route, action) {

    const card = document.createElement("div");

    card.className = "route-card";

    if (route === "EMERGENCY") {
        card.classList.add("emergency");
    }

    card.innerHTML = `
        <div class="route-label">SANG ROUTING RESULT</div>
        <div class="route-name">${route}</div>
        <div class="route-info">${action}</div>
    `;

    conversation.appendChild(card);

    conversation.scrollTop = conversation.scrollHeight;
}


function addAgricultureResult(result) {

    if (
        !result ||
        !result.results ||
        result.results.length === 0
    ) {
        return;
    }

    const resultContainer =
        document.createElement("div");

    resultContainer.className = "result";

    const first = result.results[0];

    let html = `
        <div class="result-title">
            SANG FOUND ${(
                (first.helpers || []).length +
                (first.resources || []).length +
                (first.opportunities || []).length
            )} RELEVANT CONNECTIONS
        </div>

        <div class="problem-title">
            ${first.problem.title}
        </div>

        <div class="description">
            ${first.problem.description}
        </div>

        <div class="location">
            Location: ${first.problem.location}
        </div>
    `;


    // ---------------------------------------------------------
    // LOCAL HELPER
    // ---------------------------------------------------------

    if (
        first.helpers &&
        first.helpers.length > 0
    ) {

        const helper = first.helpers[0];

        html += `
            <div class="result-section">
                <h3>👤 Local Helper</h3>

                <p>
                    <strong>${helper.name}</strong>
                </p>

                <div class="match-reason">
                    <strong>Why this match?</strong>
                    <ul>
                        ${
                            (helper.reasons || [])
                                .map(
                                    reason =>
                                        `<li>${reason}</li>`
                                )
                                .join("")
                        }
                    </ul>
                </div>
            </div>
        `;
    }


    // ---------------------------------------------------------
    // RESOURCE
    // ---------------------------------------------------------

    if (
        first.resources &&
        first.resources.length > 0
    ) {

        const resource = first.resources[0];

        html += `
            <div class="result-section">
                <h3>📖 Resource</h3>

                <p>
                    <strong>${resource.name}</strong>
                </p>

                <div class="match-reason">
                    <strong>Why this match?</strong>
                    <ul>
                        ${
                            (resource.reasons || [])
                                .map(
                                    reason =>
                                        `<li>${reason}</li>`
                                )
                                .join("")
                        }
                    </ul>
                </div>
            </div>
        `;
    }


    // ---------------------------------------------------------
    // OPPORTUNITY
    // ---------------------------------------------------------

    if (
        first.opportunities &&
        first.opportunities.length > 0
    ) {

        const opportunity =
            first.opportunities[0];

        html += `
            <div class="result-section">
                <h3>🎯 Opportunity</h3>

                <p>
                    <strong>${opportunity.title}</strong>
                </p>

                <div class="match-reason">
                    <strong>Why this match?</strong>
                    <ul>
                        ${
                            (opportunity.reasons || [])
                                .map(
                                    reason =>
                                        `<li>${reason}</li>`
                                )
                                .join("")
                        }
                    </ul>
                </div>
            </div>
        `;
    }


    html += `
        <div class="routed">
            ROUTED BY SANG
        </div>
    `;

    resultContainer.innerHTML = html;

    conversation.appendChild(resultContainer);

    conversation.scrollTop =
        conversation.scrollHeight;
}

 {

    sendButton.disabled = isLoading;

    messageInput.disabled = isLoading;

    statusElement.textContent =
        isLoading ? "SANG is thinking..." : "";
}


async function startSession(message) {

    const response = await fetch(`${API_BASE}/333`, {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            message: message
        })
    });


    if (!response.ok) {
        throw new Error(`Server returned ${response.status}`);
    }


    return await response.json();
}


async function continueSession(sessionId, message) {

    const response = await fetch(
        `${API_BASE}/333/${sessionId}`,
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message
            })
        }
    );


    if (!response.ok) {
        throw new Error(`Server returned ${response.status}`);
    }


    return await response.json();
}


function handleSangResponse(data) {

    activeSessionId = data.session_id || activeSessionId;


    // ---------------------------------------------------------
    // INFORMATION
    // ---------------------------------------------------------

    if (data.route === "INFORMATION") {

        waitingForFollowUp = false;

        addRouteCard(
            "INFORMATION",
            data.action
        );

        if (
            data.result &&
            data.result.results &&
            data.result.results.length > 0
        ) {
            addAgricultureResult(data.result);
        }

        return;
    }


    // ---------------------------------------------------------
    // ASSISTANCE â€” MISSING INFORMATION
    // ---------------------------------------------------------

    if (
        data.route === "ASSISTANCE" &&
        data.status === "NEEDS_INFORMATION"
    ) {

        waitingForFollowUp = true;

        addRouteCard(
            "ASSISTANCE",
            "SANG needs one more piece of information before matching."
        );

        if (data.prompt) {
            addMessage(data.prompt, "sang");
        }

        return;
    }


    // ---------------------------------------------------------
    // ASSISTANCE â€” ROUTED
    // ---------------------------------------------------------

    if (
        data.route === "ASSISTANCE" &&
        data.status === "ROUTED"
    ) {

        waitingForFollowUp = false;

        addRouteCard(
            "ASSISTANCE",
            data.action
        );

        if (
            data.result &&
            data.result.results &&
            data.result.results.length > 0
        ) {
            addAgricultureResult(data.result);
        }

        return;
    }


    // ---------------------------------------------------------
    // EMERGENCY
    // ---------------------------------------------------------

    if (
        data.route === "EMERGENCY"
    ) {

        waitingForFollowUp = false;

        addRouteCard(
            "EMERGENCY",
            data.action
        );

        addMessage(
            "Please contact appropriate emergency services or a trusted human immediately. SANG does not delay emergency escalation for a long AI conversation.",
            "sang"
        );

        return;
    }


    // ---------------------------------------------------------
    // UNKNOWN
    // ---------------------------------------------------------

    if (
        data.route === "UNKNOWN"
    ) {

        waitingForFollowUp = false;

        addRouteCard(
            "UNKNOWN",
            data.action
        );

        if (data.prompt) {
            addMessage(data.prompt, "sang");
        }

        return;
    }


    // ---------------------------------------------------------
    // FALLBACK
    // ---------------------------------------------------------

    addMessage(
        "I could not safely process that request.",
        "sang"
    );
}

let recognition = null;
let isListening = false;
let voiceResponseMode = false;

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

function speakSang(text) {
    if (!("speechSynthesis" in window)) {
        return;
    }

    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);

    utterance.lang = "en-IN";
    utterance.rate = 0.95;
    utterance.pitch = 1;

    window.speechSynthesis.speak(utterance);
}


function setupVoiceRecognition() {
    if (!SpeechRecognition) {
        return;
    }

    recognition = new SpeechRecognition();

    recognition.lang = "en-IN";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = function () {
        isListening = true;

        const button = document.getElementById("voiceButton");

        if (button) {
            button.textContent = "ðŸ”´ Listening...";
        }
    };


    recognition.onresult = function (event) {
        const transcript =
            event.results[0][0].transcript;

        const input =
            document.getElementById("messageInput");

        if (input) {
            input.value = transcript;
        }

        sendMessage(true);
    };


    recognition.onerror = function (event) {
        console.error(
            "Speech recognition error:",
            event.error
        );

        isListening = false;

        const button = document.getElementById("voiceButton");

        if (button) {
            button.textContent = "ðŸŽ™ï¸ Speak";
        }
    };


    recognition.onend = function () {
        isListening = false;

        const button = document.getElementById("voiceButton");

        if (button) {
            button.textContent = "ðŸŽ™ï¸ Speak";
        }
    };
}


function startVoiceInput() {
    if (!recognition) {
        alert(
            "Voice input is not supported in this browser. Please use Google Chrome."
        );

        return;
    }

    if (isListening) {
        recognition.stop();
        return;
    }

    recognition.start();
}


function renderVoicePipeline(pipeline) {
    const container =
        document.getElementById("voicePipeline");

    if (!container || !pipeline) {
        return;
    }

    container.innerHTML = "";

    pipeline.forEach(function (stage) {
        const card = document.createElement("div");

        card.className = "pipeline-stage";

        card.innerHTML = `
            <div class="pipeline-stage-name">
                ${stage.stage}
            </div>
            <div class="pipeline-stage-description">
                ${stage.description || ""}
            </div>
        `;

        container.appendChild(card);
    });
}


function initializeVoice() {
    setupVoiceRecognition();
}

async function sendMessage(fromVoice = false) {

    voiceResponseMode = fromVoice;

    const message = messageInput.value.trim();

    if (!message) {
        return;
    }


    addMessage(message, "user");

    messageInput.value = "";

    setLoading(true);


    try {

        let data;


        // -----------------------------------------------------
        // CONTINUATION OF EXISTING 333 SESSION
        // -----------------------------------------------------

        if (
            waitingForFollowUp &&
            activeSessionId
        ) {

            data = await continueSession(
                activeSessionId,
                message
            );

        }

        // -----------------------------------------------------
        // NEW 333 SESSION
        // -----------------------------------------------------

        else {

            data = await startSession(message);
        }


        handleSangResponse(data);


    } catch (error) {

        console.error(error);

        addMessage(
            "I could not connect to SANG. Please make sure the SANG backend is running.",
            "sang"
        );

    } finally {

        setLoading(false);

        messageInput.focus();
    }
}


function resetSession() {

    activeSessionId = null;

    waitingForFollowUp = false;

    conversation.innerHTML = "";

    addMessage(
        "Hello. I am SANG through 333. Tell me what you need help with.",
        "sang"
    );

    statusElement.textContent = "";

    messageInput.value = "";

    messageInput.focus();
}


sendButton.addEventListener(
    "click",
    sendMessage
);


messageInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();
        }
    }
);


resetButton.addEventListener(
    "click",
    resetSession
);


resetSession();

</script>

</body>
</html>
<script>initializeVoice();</script>

<script>document.getElementById('voiceButton').addEventListener('click', startVoiceInput);</script>
